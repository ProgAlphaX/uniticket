<header class="cabecera">
  <h2>Avisos</h2>
  <button matButton="text" type="button" [disabled]="!noLeidas()" (click)="marcarTodas()">Marcar todas como leídas</button>
  <button matIconButton type="button" aria-label="Cerrar avisos" (click)="cerrar.emit()">
    <mat-icon fontSet="material-symbols-rounded">close</mat-icon>
  </button>
</header>

<mat-button-toggle-group
  class="filtro"
  aria-label="Filtrar avisos"
  hideSingleSelectionIndicator
  [value]="filtro()"
  (change)="filtro.set($event.value)"
>
  <mat-button-toggle value="TODAS">Todas</mat-button-toggle>
  <mat-button-toggle value="NO_LEIDAS">No leídas ({{ noLeidas() }})</mat-button-toggle>
</mat-button-toggle-group>

@if (visibles().length) {
  <ul class="lista">
    @for (aviso of visibles(); track aviso.nId_Notificacion) {
      <li>
        <button type="button" class="aviso" [class.nuevo]="!aviso.bLeida" (click)="abrir(aviso)">
          <span class="icono" [style.color]="color(aviso)" [style.background]="color(aviso) + '1a'">
            <mat-icon fontSet="material-symbols-rounded">{{ icono(aviso) }}</mat-icon>
          </span>
          <span class="texto">
            <b>{{ aviso.sMensaje }}</b>
            <small>{{ aviso.sNum_Ticket }} · {{ aviso.sAsunto }}</small>
            <small class="hora">{{ tiempo(aviso.dFecha) }}</small>
          </span>
          @if (!aviso.bLeida) {
            <i class="punto" aria-label="Sin leer"></i>
          }
        </button>
      </li>
    }
  </ul>
} @else {
  <ut-empty-state
    [titulo]="filtro() === 'TODAS' ? 'No tienes avisos' : 'Estás al día'"
    [mensaje]="filtro() === 'TODAS' ? 'Aquí verás los cambios en tus solicitudes.' : 'No tienes avisos sin leer.'"
  />
}
