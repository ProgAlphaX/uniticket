<div class="drawer">

  <div class="header">

    <button class="close-btn" type="button">
      <mat-icon fontSet="material-symbols-rounded">
        close
      </mat-icon>
    </button>

    <h2>Notificaciones</h2>

    <button
      class="mark-all"
      type="button"
      (click)="marcarTodas()">
      Marcar todas como leídas
    </button>

  </div>

  <div class="tabs">

    <button
      class="tab"
      [class.active]="filtro() === 'TODAS'"
      (click)="cambiarFiltro('TODAS')">

      Todas

    </button>

    <button
      class="tab"
      [class.active]="filtro() === 'NO_LEIDAS'"
      (click)="cambiarFiltro('NO_LEIDAS')">

      No leídas ({{ noLeidas() }})

    </button>

  </div>

  <div class="lista">

    @for (item of visibles(); track item.nId_Notificacion) {

      <div
        class="item"
        (click)="marcarLeida(item.nId_Notificacion)">

        <div
          class="icono"
          [class.respuesta]="esRespuesta(item.sTipo)"
          [class.solicitud]="!esRespuesta(item.sTipo)">

          @if (esRespuesta(item.sTipo)) {

            <mat-icon fontSet="material-symbols-rounded">
              chat_bubble
            </mat-icon>

          } @else {

            <mat-icon fontSet="material-symbols-rounded">
              work
            </mat-icon>

          }

        </div>

        <div class="contenido">

          <div class="titulo">
            {{ item.sMensaje }}
          </div>

          <div class="detalle">
            {{ item.sAsunto }}
            ·
            {{ tiempo(item.dFecha) }}
          </div>

        </div>

        @if (!item.bLeida) {
          <div class="dot"></div>
        }

      </div>

    }

  </div>

  <div class="footer">
    Se actualiza cada 30 s · GET /api/notificaciones
  </div>

</div>
