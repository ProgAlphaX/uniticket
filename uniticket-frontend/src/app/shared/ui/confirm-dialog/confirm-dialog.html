<div class="icono" [class.icono--peligro]="data.peligro">
  <mat-icon fontSet="material-symbols-rounded">{{ data.icono ?? 'help' }}</mat-icon>
</div>
<h2 mat-dialog-title>{{ data.titulo }}</h2>
<mat-dialog-content>
  <p>{{ data.mensaje }}</p>
</mat-dialog-content>
<mat-dialog-actions align="center">
  <button matButton="outlined" [mat-dialog-close]="false">Cancelar</button>
  <button matButton="filled" [class.peligro]="data.peligro" [mat-dialog-close]="true" cdkFocusInitial>
    {{ data.confirmar }}
  </button>
</mat-dialog-actions>
